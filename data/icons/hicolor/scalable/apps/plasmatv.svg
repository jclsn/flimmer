<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4d555e"/>
      <stop offset="1" stop-color="#232629"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5fc3f5"/>
      <stop offset="0.55" stop-color="#3daee9"/>
      <stop offset="1" stop-color="#1b5f94"/>
    </linearGradient>
    <linearGradient id="stand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#31363b"/>
      <stop offset="1" stop-color="#555d66"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- antennas -->
  <g stroke="#4d555e" stroke-width="4" stroke-linecap="round">
    <line x1="64" y1="26" x2="42" y2="6"/>
    <line x1="64" y1="26" x2="88" y2="4"/>
  </g>
  <circle cx="42" cy="6" r="4" fill="#3daee9"/>
  <circle cx="88" cy="4" r="4" fill="#3daee9"/>

  <!-- shadow and stand -->
  <ellipse cx="64" cy="121" rx="40" ry="5" fill="url(#shadow)"/>
  <path d="M56 98 h16 l4 14 h-24 z" fill="url(#stand)"/>
  <rect x="38" y="111" width="52" height="7" rx="3.5" fill="#31363b"/>

  <!-- body -->
  <rect x="6" y="24" width="116" height="80" rx="10" fill="url(#bezel)"/>
  <rect x="6.5" y="24.5" width="115" height="79" rx="9.5" fill="none" stroke="#fff" stroke-opacity="0.12"/>

  <!-- screen with a soft reflection -->
  <rect x="13" y="31" width="102" height="62" rx="5" fill="url(#screen)"/>
  <path d="M13 36 a5 5 0 0 1 5 -5 h50 l-30 62 h-20 a5 5 0 0 1 -5 -5 z" fill="#fff" fill-opacity="0.13"/>

  <!-- play symbol -->
  <path d="M55 48.5 v27 a2.5 2.5 0 0 0 3.8 2.1 l21.5 -13.5 a2.5 2.5 0 0 0 0 -4.2 l-21.5 -13.5 a2.5 2.5 0 0 0 -3.8 2.1 z" fill="#fff" fill-opacity="0.92"/>

  <!-- power LED -->
  <circle cx="113" cy="98.5" r="2" fill="#4cd28a"/>
</svg>
