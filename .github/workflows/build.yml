name: Build

on:
  push:
    branches: [main]
    # Pushing a tag like v0.1.0 publishes a release with the packages below
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reuse:
    name: Licensing (REUSE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: fsfe/reuse-action@v6

  lint:
    name: Linting
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    container: ubuntu:26.10
    steps:
      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            clang-format \
            clang-tidy \
            cmake \
            extra-cmake-modules \
            gettext \
            git \
            libkf6i18n-dev \
            libkirigami-dev \
            libqt6sql6-sqlite \
            ninja-build g++ \
            pipx \
            qt6-base-dev \
            qt6-declarative-dev \
            qt6-declarative-dev-tools \
            qt6-multimedia-dev \
            qtkeychain-qt6-dev

      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: gersemi check
        run: |
          find . -path './bigscreen-ui' -prune -o -type f -name 'CMakeLists.txt' -print0 \
            | xargs -0 pipx run gersemi --check --no-warn-about-unknown-commands

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUSE_SYSTEM_BIGSCREEN_UI=OFF

      - name: Build
        run: cmake --build build

      - name: clang-format check
        run: |
          find src -type f \( -name '*.cpp' -o -name '*.h' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror

      - name: clang-tidy
        run: |
          find src -type f \( -name '*.cpp' \) -print0 \
            | xargs -0 -n1 clang-tidy --warnings-as-errors="*" --quiet -p build

  ubuntu:
    # 26.10 is the first release with Qt 6.11, which Bigscreen UI needs.
    name: Ubuntu 26.10 (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: ubuntu:26.10
    steps:
      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            cmake \
            extra-cmake-modules \
            gettext \
            git \
            libkf6i18n-dev \
            libkirigami-dev \
            libqt6sql6-sqlite \
            ninja-build g++ \
            qt6-base-dev \
            qt6-declarative-dev \
            qt6-declarative-dev-tools \
            qt6-multimedia-dev \
            qtkeychain-qt6-dev

      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUSE_SYSTEM_BIGSCREEN_UI=OFF

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Install (smoke test)
        run: DESTDIR="$PWD/stage" cmake --install build

  arch:
    name: Arch Linux
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install toolchain and dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel \
            breeze \
            breeze-icons \
            cmake \
            extra-cmake-modules \
            git \
            ki18n \
            kirigami \
            qqc2-desktop-style \
            qt6-base \
            qt6-declarative \
            qt6-multimedia \
            qt6-multimedia-ffmpeg \
            qt6-svg \
            qtkeychain-qt6

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true

      - name: Build package
        run: |
          useradd -m builder
          chown -R builder: "$GITHUB_WORKSPACE"
          # Bigscreen UI isn't in the Arch repositories yet
          su builder -c "cd '$GITHUB_WORKSPACE/packaging/arch/bigscreen-ui' && makepkg --noconfirm"
          pacman -U --noconfirm packaging/arch/bigscreen-ui/*.pkg.tar.zst
          su builder -c "cd '$GITHUB_WORKSPACE/packaging/arch' && makepkg --noconfirm"

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: flimmer-arch-x86_64
          # Flimmer can't be installed without the Bigscreen UI package
          path: |
            packaging/arch/*.pkg.tar.zst
            packaging/arch/bigscreen-ui/*.pkg.tar.zst
            !packaging/arch/**/*-debug-*.pkg.tar.zst

  flatpak:
    name: Flatpak (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      options: --privileged
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Build bundle
        uses: flathub-infra/flatpak-github-actions/flatpak-builder@933e9e8ca36e85046ebca8e211f0785c6becac40
        with:
          manifest-path: packaging/flatpak/io.github.jclsn.Flimmer.yml
          bundle: flimmer-${{ matrix.arch }}.flatpak
          arch: ${{ matrix.arch }}
          upload-artifact: false

      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: flimmer-flatpak-${{ matrix.arch }}
          path: flimmer-${{ matrix.arch }}.flatpak

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [reuse, ubuntu, arch, flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the project version
        id: version
        run: |
          version=$(sed -n 's/^project(flimmer VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in CMakeLists.txt"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd artifacts
          # The Bigscreen UI package is in a subdirectory of the Arch artifact
          mv bigscreen-ui/*.pkg.tar.zst .
          for arch in x86_64 aarch64; do
            mv "flimmer-$arch.flatpak" "flimmer-$VERSION-$arch.flatpak"
          done
          cat > notes.md <<EOF
          ## Install

          **Flatpak (KDE Linux, any distribution):** download the \`.flatpak\` for your machine
          (\`x86_64\` for PCs, \`aarch64\` for Raspberry Pi and other ARM boards), then open it in
          Discover or run:

              flatpak install --user flimmer-$VERSION-x86_64.flatpak

          Flimmer then shows up as "Live TV" on the Plasma Bigscreen home screen. To update, install the
          bundle from a newer release.

          **Arch Linux (x86_64):** download both \`.pkg.tar.zst\` files and install them together:

              sudo pacman -U bigscreen-ui-*.pkg.tar.zst flimmer-*.pkg.tar.zst
          EOF
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Flimmer $VERSION" \
            --notes-file notes.md \
            ./*.flatpak ./*.pkg.tar.zst

