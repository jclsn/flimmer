name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reuse:
    name: Licensing (REUSE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: fsfe/reuse-action@v6

  ubuntu:
    # 26.10 is the first release with Qt 6.11, which Bigscreen UI needs.
    name: Ubuntu 26.10 (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: ubuntu:26.10
    steps:
      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            cmake \
            extra-cmake-modules \
            gettext \
            git \
            libkf6i18n-dev \
            libkirigami-dev \
            libqt6sql6-sqlite \
            ninja-build g++ \
            qt6-base-dev \
            qt6-declarative-dev \
            qt6-declarative-dev-tools \
            qt6-multimedia-dev \
            qtkeychain-qt6-dev

      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUSE_SYSTEM_BIGSCREEN_UI=OFF

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Install (smoke test)
        run: DESTDIR="$PWD/stage" cmake --install build

  arch:
    name: Arch Linux
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install toolchain and dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel \
            breeze \
            breeze-icons \
            cmake \
            extra-cmake-modules \
            git \
            ki18n \
            kirigami \
            qqc2-desktop-style \
            qt6-base \
            qt6-declarative \
            qt6-multimedia \
            qt6-multimedia-ffmpeg \
            qt6-svg \
            qtkeychain-qt6

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true

      - name: Build package
        run: |
          useradd -m builder
          chown -R builder: "$GITHUB_WORKSPACE"
          # Bigscreen UI isn't in the Arch repositories yet
          su builder -c "cd '$GITHUB_WORKSPACE/packaging/arch/bigscreen-ui' && makepkg --noconfirm"
          pacman -U --noconfirm packaging/arch/bigscreen-ui/*.pkg.tar.zst
          su builder -c "cd '$GITHUB_WORKSPACE/packaging/arch' && makepkg --noconfirm"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: plasma-tv-arch-x86_64
          path: packaging/arch/*.pkg.tar.zst

